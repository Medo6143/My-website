<nav #navbar
    class="fixed w-full z-[9999] transition-all duration-500 glass-panel border-b border-white/5 rounded-none backdrop-blur-xl"
    [ngClass]="themeService.isLightMode() ? 'bg-white/40 border-black/10' : 'bg-black/40 border-white/5'">
    
    <div class="max-w-7xl mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
        <!-- Logo -->
        <div (click)="scrollTo('#hero', $event)" 
             class="text-xl font-bold tracking-widest uppercase cursor-pointer select-none transition-colors duration-300"
             [ngClass]="themeService.isLightMode() ? 'text-black' : 'text-white'">
            <span class="text-brand-primary text-glow">M</span>ohamed
        </div>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center gap-8">
            <ul class="flex gap-8 items-center text-sm font-medium tracking-wide">
                <li *ngFor="let link of navLinks">
                    <a [href]="link.target" (click)="scrollTo(link.target, $event)"
                        class="transition-colors duration-300 uppercase select-none cursor-pointer"
                        [ngClass]="themeService.isLightMode() ? 'text-text-muted hover:text-black' : 'text-text-muted hover:text-white'">
                        {{ link.name }}
                    </a>
                </li>
            </ul>

            <!-- Tools: Theme toggle and CV -->
            <div class="flex items-center gap-4 pl-4 border-l border-white/10"
                 [class.border-black/10]="themeService.isLightMode()">
                <a href="/cv.pdf" target="_blank" download="Mohamed_Wael_Frontend_Developer_CV.pdf"
                    class="px-5 py-2 text-brand-primary border border-brand-primary/50 hover:bg-brand-primary/10 rounded-full transition-all duration-300 flex items-center gap-2 text-sm font-bold uppercase">
                    CV
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                </a>

                <button (click)="themeService.toggleTheme()" 
                        class="p-2 rounded-full border transition-all duration-300 flex items-center justify-center hover:scale-110 active:scale-95 shadow-sm"
                        [ngClass]="themeService.isLightMode() ? 'border-black/10 text-brand-primary hover:bg-black/5' : 'border-white/10 text-brand-primary hover:bg-white/5'">
                    <!-- Sun Icon (shows in dark mode) -->
                    <svg *ngIf="!themeService.isLightMode()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon Icon (shows in light mode) -->
                    <svg *ngIf="themeService.isLightMode()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Controls (Toggle + Theme) -->
        <div class="flex md:hidden items-center gap-3">
            <button (click)="themeService.toggleTheme()" 
                    class="p-2 rounded-full border transition-all duration-300 flex items-center justify-center active:scale-95"
                    [ngClass]="themeService.isLightMode() ? 'border-black/10 text-brand-primary' : 'border-white/10 text-brand-primary'">
                    <svg *ngIf="!themeService.isLightMode()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg *ngIf="themeService.isLightMode()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
            </button>
            <button (click)="toggleMenu()" 
                    class="p-2 transition-colors active:scale-95"
                    [ngClass]="themeService.isLightMode() ? 'text-black' : 'text-white'">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" x2="20" y1="12" y2="12" [class.opacity-0]="isMenuOpen" class="transition-opacity duration-300"/>
                    <line x1="4" x2="20" y1="6" y2="6" [class.rotate-45]="isMenuOpen" [style.transform-origin]="'center'" class="transition-transform duration-300"/>
                    <line x1="4" x2="20" y1="18" y2="18" [class.-rotate-45]="isMenuOpen" [style.transform-origin]="'center'" class="transition-transform duration-300"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div [ngClass]="isMenuOpen ? 'translate-y-0 opacity-100' : '-translate-y-full opacity-0 pointer-events-none'"
         class="fixed inset-0 top-20 bg-white/95 dark:bg-black/95 backdrop-blur-2xl transition-all duration-500 z-[-1] flex flex-col justify-center items-center px-10 gap-10 md:hidden"
         [class.bg-white/95]="themeService.isLightMode()"
         [class.bg-black/95]="!themeService.isLightMode()">
        <ul class="flex flex-col gap-6 text-center">
            <li *ngFor="let link of navLinks">
                <a [href]="link.target" (click)="scrollTo(link.target, $event)"
                    class="text-2xl font-bold uppercase tracking-widest transition-colors duration-300"
                    [ngClass]="themeService.isLightMode() ? 'text-black hover:text-brand-primary' : 'text-white hover:text-brand-primary'">
                    {{ link.name }}
                </a>
            </li>
        </ul>

        <a href="/cv.pdf" target="_blank" download="Mohamed_Wael_Frontend_Developer_CV.pdf"
            class="px-10 py-4 text-brand-primary border-2 border-brand-primary bg-brand-primary/5 rounded-full font-bold uppercase tracking-widest flex items-center gap-3">
            Download CV
            <svg class="w-6 h-6 animate-bounce" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
        </a>
    </div>
</nav>
